<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80" width="220" height="80">
  <defs>
    <linearGradient id="esmaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="esmaGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadowEsma" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="2" y="2" width="216" height="76" rx="8" fill="url(#esmaGrad)" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadowEsma)"/>

  <!-- Left Seal -->
  <g transform="translate(10, 10)">
    <circle cx="30" cy="30" r="28" fill="#ffffff" stroke="#92400e" stroke-width="2"/>
    <!-- UAE Falcon / Star emblem silhouette -->
    <path d="M30 10 L33 22 L45 22 L35 30 L39 42 L30 35 L21 42 L25 30 L15 22 L27 22 Z" fill="#b45309" />
    <circle cx="30" cy="27" r="5" fill="#fef3c7" />
    <text x="30" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="6.5" fill="#78350f">ESMA UAE</text>
  </g>

  <!-- Right Details -->
  <text x="78" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13.5" fill="#ffffff" letter-spacing="0.5">ESMA CERTIFIED</text>
  <text x="78" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="9" fill="url(#esmaGold)" letter-spacing="0.5">EMIRATES QUALITY MARK</text>
  <rect x="78" y="50" width="130" height="1" fill="#fde68a" opacity="0.3" />
  <text x="78" y="64" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="8" fill="#fef3c7">REGULATORY COMPLIANT (UAE)</text>
</svg>
