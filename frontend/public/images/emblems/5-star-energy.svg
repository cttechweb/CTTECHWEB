<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" width="240" height="100">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="2" y="2" width="236" height="96" rx="10" fill="url(#bgGrad5)" stroke="#fbbf24" stroke-width="2" filter="url(#shadow5)"/>

  <!-- Left Star Rating Block -->
  <rect x="8" y="8" width="80" height="84" rx="8" fill="#ffffff" />
  
  <!-- Star icon header -->
  <text x="48" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#065f46">5 STAR</text>
  
  <!-- 5 Gold Stars in an arc/row -->
  <g transform="translate(14, 34) scale(0.68)">
    <!-- Star 1 -->
    <polygon points="12,0 15,9 24,9 17,15 19,24 12,18 5,24 7,15 0,9 9,9" fill="url(#goldGrad)" stroke="#b45309" stroke-width="0.5"/>
    <!-- Star 2 -->
    <g transform="translate(20, 0)">
      <polygon points="12,0 15,9 24,9 17,15 19,24 12,18 5,24 7,15 0,9 9,9" fill="url(#goldGrad)" stroke="#b45309" stroke-width="0.5"/>
    </g>
    <!-- Star 3 -->
    <g transform="translate(40, 0)">
      <polygon points="12,0 15,9 24,9 17,15 19,24 12,18 5,24 7,15 0,9 9,9" fill="url(#goldGrad)" stroke="#b45309" stroke-width="0.5"/>
    </g>
    <!-- Star 4 -->
    <g transform="translate(60, 0)">
      <polygon points="12,0 15,9 24,9 17,15 19,24 12,18 5,24 7,15 0,9 9,9" fill="url(#goldGrad)" stroke="#b45309" stroke-width="0.5"/>
    </g>
    <!-- Star 5 -->
    <g transform="translate(80, 0)">
      <polygon points="12,0 15,9 24,9 17,15 19,24 12,18 5,24 7,15 0,9 9,9" fill="url(#goldGrad)" stroke="#b45309" stroke-width="0.5"/>
    </g>
  </g>

  <!-- Subtext under stars in left block -->
  <text x="48" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="8.5" fill="#047857" letter-spacing="0.5">HIGH EFFICIENCY</text>
  <text x="48" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="7" fill="#6b7280">SAVE UP TO 40%</text>

  <!-- Right text details -->
  <text x="100" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" fill="#ffffff" letter-spacing="0.5">ENERGY EFFICIENCY</text>
  <text x="100" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" fill="#fbbf24" letter-spacing="0.5">★ ★ ★ ★ ★ RATING</text>
  
  <rect x="100" y="52" width="130" height="1" fill="#34d399" opacity="0.4" />
  
  <text x="100" y="68" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="8.5" fill="#ecfdf5">ESMA / UAE COMPLIANT</text>
  <text x="100" y="82" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="7.5" fill="#a7f3d0">TROPICAL CLIMATE TESTED</text>
</svg>
